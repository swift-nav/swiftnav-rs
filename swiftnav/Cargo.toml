[package]
name = "swiftnav"
version = "0.13.1"
authors = ["Swift Navigation <dev@swiftnav.com>"]
edition = "2024"
description = "GNSS positioning and related utilities"
readme = "README.md"
repository = "https://github.com/swift-nav/swiftnav-rs"
license = "LGPL-3.0"
rust-version = "1.89.0"

[dependencies]
bon = "3.8.1"
rustversion = "1.0.22"
chrono = { version = "0.4", optional = true }
strum = { version = "0.28.0", features = ["derive"] }
nalgebra = "0.35.0"
thiserror = "2.0.17"
jiff = { version = "0.2", optional = true }
hifitime = { version = "4", optional = true }

[dev-dependencies]
float_eq = "1.0.1"
proptest = "1.9.0"
nmea = "0.8"

[features]
default = ["chrono"]
chrono = ["dep:chrono"]
jiff = ["dep:jiff"]
hifitime = ["dep:hifitime"]

# This tells docs.rs to include the katex header for math formatting
# To do this locally 
[package.metadata.docs.rs]
rustdoc-args = ["--html-in-header", "katex-header.html"]
