---
name: CI
on:
  pull_request:
  push:
    branches:
      - "master"
  schedule:
    - cron: "0 16 * * 1" # 8am PST every Monday
jobs:
  lint:
    name: Lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Install rust
        run: |
          rustup -V
          rustup set profile minimal
          rustup toolchain install stable
          rustup show

      - name: Check Formatting
        run: just fmt-check

      - name: Clippy
        run: just lint

      # Check for docs warnings
      # Only do this for the swiftnav crate since swiftnav-sys has some errors
      # in the bindgen output
      - name: Docs
        run: just docs

  doc-rs:
    name: docs-rs test
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install rust
        run: |
          rustup -V
          rustup set profile minimal
          rustup toolchain install nightly
          rustup show

      - name: Install cargo-docs-rs
        run: cargo install --locked cargo-docs-rs@1.0.4

      - run: cargo docs-rs -p swiftnav

  build:
    name: Build and test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Ubuntus
          - os: ubuntu-latest
            binary_target: x86_64-unknown-linux-musl
            needs_musl: true
            toolchain: stable
          # MacOS ARM
          - os: macos-latest
            binary_target: aarch64-apple-darwin
            toolchain: stable
          # Windows
          - os: windows-latest
            binary_target: x86_64-pc-windows-msvc
            toolchain: stable
          # Nightly Rust
          - os: ubuntu-latest
            binary_target: x86_64-unknown-linux-gnu
            toolchain: nightly
          # MSRV
          - os: ubuntu-latest
            binary_target: x86_64-unknown-linux-gnu
            toolchain: 1.89.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Install musl tools
        if: matrix.needs_musl
        run: |
          sudo apt-get install musl-tools
          sudo ln -s /usr/bin/musl-gcc /usr/bin/musl-g++

      - name: Install rust ${{ matrix.binary_target }}
        run: |
          rustup -V
          rustup set profile minimal
          rustup default ${{ matrix.toolchain }}
          rustup target add ${{ matrix.binary_target }}
          rustup show

      - name: Build
        env:
          CARGO_BUILD_TARGET: ${{ matrix.binary_target }}
        run: just build

      - name: Test
        env:
          CARGO_BUILD_TARGET: ${{ matrix.binary_target }}
        run: just test
